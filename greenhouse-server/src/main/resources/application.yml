server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: greenhouse-server
  profiles:
    active: dev

  # ============================================
  # MySQL 数据源
  # ============================================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/greenhouse?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456

  # ============================================
  # Redis
  # ============================================
  data:
    redis:
      host: localhost
      port: 6379
      password: greenhouse2026
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3s

# ============================================
# MyBatis-Plus
# ============================================
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.greenhouse.server.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ============================================
# MQTT 配置
# ============================================
mqtt:
  broker-url: tcp://localhost:1883
  username: admin
  password: public
  client-id: greenhouse-server
  default-topic: greenhouse/sensor/data
  qos: 1

# ============================================
# InfluxDB 配置
# ============================================
influxdb:
  url: http://localhost:8086
  token: greenhouse-token-2026
  org: greenhouse
  bucket: sensor

# ============================================
# JWT 配置
# ============================================
jwt:
  secret: greenhouse-secret-key-2026-please-change-it-in-production
  expire-hours: 24
  header: Authorization
  prefix: "Bearer "

# ============================================
# Knife4j / OpenAPI
# ============================================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
knife4j:
  enable: true
  setting:
    language: zh_cn

# ============================================
# 日志配置
# ============================================
logging:
  level:
    root: info
    com.greenhouse.server: debug
    org.springframework.web: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
