version: "3.8"

services:
  # ============================================
  # Redis 7 - 缓存 / 状态存储
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: greenhouse-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - ./redis/data:/data
    networks:
      - greenhouse-net

  # ============================================
  # InfluxDB 2.7 - 时序数据库（传感器历史数据）
  # ============================================
  influxdb:
    image: influxdb:2.7
    container_name: greenhouse-influxdb
    restart: unless-stopped
    ports:
      - "${INFLUXDB_PORT}:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_ADMIN_USER}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN}
    volumes:
      - ./influxdb/data:/var/lib/influxdb2
    networks:
      - greenhouse-net

  # ============================================
  # EMQX 5 - MQTT 消息代理服务器
  # ============================================
  emqx:
    image: emqx:5
    container_name: greenhouse-emqx
    restart: unless-stopped
    ports:
      - "${EMQX_MQTT_PORT}:1883"     # MQTT TCP
      - "${EMQX_WS_PORT}:8083"       # MQTT WebSocket
      - "${EMQX_DASHBOARD_PORT}:18083" # Dashboard
    environment:
      - EMQX_DASHBOARD__DEFAULT_USERNAME=${EMQX_ADMIN_USER}
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=${EMQX_ADMIN_PASSWORD}
    volumes:
      - ./emqx/data:/opt/emqx/data
      - ./emqx/log:/opt/emqx/log
    networks:
      - greenhouse-net

  # ============================================
  # MySQL 8（可选 - 本地已安装 MySQL 可注释掉此服务）
  # 端口映射为 3307 避免与本地 MySQL 冲突
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: greenhouse-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - ./mysql/data:/var/lib/mysql
    networks:
      - greenhouse-net

networks:
  greenhouse-net:
    driver: bridge
